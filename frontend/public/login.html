<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MCQPro</title>
  <meta name="description" content="Login or register to access your MCQPro examination dashboard.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary-indigo: #4f46e5;
      --primary-indigo-hover: #4338ca;
      --secondary-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --bg-light: #f4f7fb;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --glass-bg: rgba(255, 255, 255, 0.7);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Auth Container ── */
    .auth-container {
      display: flex;
      min-height: 100vh;
    }

    /* ── Left Illustration Side ── */
    .auth-illustration {
      flex: 1;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .auth-illustration::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -100px; left: -100px;
    }

    .auth-illustration::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -80px; right: -80px;
    }

    .illustration-content { max-width: 400px; position: relative; z-index: 2; }

    .auth-image {
      max-width: 85%;
      height: auto;
      margin-bottom: 2rem;
      mix-blend-mode: multiply;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .illustration-content h2 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .illustration-content p {
      font-size: 1.1rem;
      opacity: 0.85;
      line-height: 1.6;
    }

    .illus-features {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }

    .illus-feat {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .illus-feat i { color: #4ade80; font-size: 1rem; }

    /* ── Right Form Side ── */
    .auth-form-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: white;
      overflow-y: auto;
    }

    .auth-form-wrapper {
      width: 100%;
      max-width: 420px;
    }

    /* ── Logo ── */
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary-indigo);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 2.5rem;
      text-decoration: none;
    }

    .auth-logo i { font-size: 1.75rem; }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg-light);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.25s;
    }

    .auth-tab-btn.active {
      background: #fff;
      color: var(--primary-indigo);
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
    }

    /* ── Form Title ── */
    .auth-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }

    .auth-subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    /* ── Fields ── */
    .auth-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .auth-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .auth-input {
      width: 100%;
      padding: 0.65rem 0;
      border: none;
      border-bottom: 2px solid var(--border-color);
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-dark);
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-input:focus { border-bottom-color: var(--primary-indigo); }

    .password-group .eye-btn {
      position: absolute;
      right: 0;
      bottom: 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    /* ── Options Row ── */
    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
    }

    .forgot-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .forgot-link:hover { color: var(--primary-indigo); text-decoration: underline; }

    /* ── Submit Button ── */
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, var(--secondary-blue), var(--primary-indigo));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
    }

    .btn-auth:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Register Link ── */
    .register-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    .register-link {
      color: var(--primary-indigo);
      text-decoration: none;
      font-weight: 600;
    }

    .register-link:hover { text-decoration: underline; }

    /* ── Error ── */
    .error-msg {
      color: #ef4444;
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    /* ── Register Grid ── */
    .register-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1.5rem;
    }

    .register-grid .full-width { grid-column: 1 / -1; }

    /* ── Notification Toast ── */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      padding: 14px 20px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      animation: slideIn 0.3s ease;
      max-width: 320px;
    }

    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: var(--primary-indigo); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .auth-container { flex-direction: column; }
      .auth-illustration { padding: 3rem 1.5rem; min-height: 280px; }
      .auth-image { max-width: 60%; }
      .register-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="auth-container" id="login-page">
    <!-- LEFT: Illustration -->
    <div class="auth-illustration">
      <div class="illustration-content">
        <img src="/student_celebrating.png" alt="Students celebrating" class="auth-image">
        <h2>Welcome to MCQPro</h2>
        <p>The future of secure, AI-powered online testing</p>
        <div class="illus-features">
          <div class="illus-feat"><i class="fas fa-check-circle"></i> AI Proctoring</div>
          <div class="illus-feat"><i class="fas fa-check-circle"></i> Blockchain Verified Results</div>
          <div class="illus-feat"><i class="fas fa-check-circle"></i> CBSE, ICSE & State Board</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Form -->
    <div class="auth-form-container">
      <div class="auth-form-wrapper">
        <a href="/landing.html" class="auth-logo">
          <i class="fas fa-graduation-cap"></i> MCQPro
        </a>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
          <button class="auth-tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form-section">
          <h2 class="auth-title">Login</h2>
          <p class="auth-subtitle">Enter your account details</p>
          <div id="login-error" class="error-msg" style="display:none;"></div>
          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="auth-group">
              <label>Email Address</label>
              <input type="email" id="login-email" name="email" class="auth-input" placeholder="name@example.com" required>
            </div>
            <div class="auth-group password-group">
              <label>Password</label>
              <input type="password" id="login-password" name="password" class="auth-input" placeholder="••••••••" required>
              <button type="button" class="eye-btn" onclick="togglePwd('login-password', this)">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="auth-options">
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-auth" id="login-btn">Login</button>
          </form>
          <p class="register-text">
            Don't have an account? <a class="register-link" onclick="switchTab('register')" href="#">Sign Up</a>
          </p>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form-section" style="display:none;">
          <h2 class="auth-title">Sign Up</h2>
          <p class="auth-subtitle">Create your new account</p>
          <div id="register-error" class="error-msg" style="display:none;"></div>
          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="register-grid">
              <div class="auth-group">
                <label>Full Name *</label>
                <input type="text" name="name" class="auth-input" placeholder="John Doe" required>
              </div>
              <div class="auth-group">
                <label>Email Address *</label>
                <input type="email" name="email" class="auth-input" placeholder="your@email.com" required>
              </div>
              <div class="auth-group">
                <label>Mobile Number *</label>
                <input type="tel" name="mobile" class="auth-input" placeholder="10-digit number">
              </div>
              <div class="auth-group">
                <label>School / Institution</label>
                <input type="text" name="school" class="auth-input" placeholder="Your school name">
              </div>
              <div class="auth-group">
                <label>City</label>
                <input type="text" name="city" class="auth-input" placeholder="Your city">
              </div>
              <div class="auth-group">
                <label>Account Type</label>
                <select name="role" class="auth-input">
                  <option value="student">Student</option>
                  <option value="teacher">Teacher</option>
                </select>
              </div>
              <div class="auth-group password-group">
                <label>Password *</label>
                <input type="password" id="reg-password" name="password" class="auth-input" placeholder="Min. 6 characters" required>
                <button type="button" class="eye-btn" onclick="togglePwd('reg-password', this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="auth-group password-group">
                <label>Confirm Password *</label>
                <input type="password" id="reg-confirm" name="confirmPassword" class="auth-input" placeholder="Repeat password" required>
                <button type="button" class="eye-btn" onclick="togglePwd('reg-confirm', this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="full-width">
                <button type="submit" class="btn-auth" id="register-btn">Register</button>
              </div>
            </div>
          </form>
          <p class="register-text">
            Already have an account? <a class="register-link" onclick="switchTab('login')" href="#">Login here</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/shared/api.js?v=20"></script>
  <script src="/js/shared/auth.js?v=20"></script>

  <script>
    // ── Tab switching ──
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('login-form-section').style.display = isLogin ? 'block' : 'none';
      document.getElementById('register-form-section').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
    }

    // ── Password toggle ──
    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    // ── Toast ──
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // ── Login ──
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await auth.login(email, password);
        showToast('Welcome back!', 'success');
      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Please check your credentials.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Login';
      }
    }

    // ── Register ──
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errEl = document.getElementById('register-error');
      errEl.style.display = 'none';

      const formData = new FormData(e.target);
      const userData = Object.fromEntries(formData);

      if (userData.password !== userData.confirmPassword) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        await auth.register(userData);
        showToast('Account created! Please log in.', 'success');
        switchTab('login');
      } catch (err) {
        errEl.textContent = err.message || 'Registration failed. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Register';
      }
    }

    // ── Redirect if already logged in ──
    document.addEventListener('DOMContentLoaded', () => {
      if (auth.isAuthenticated()) {
        auth.redirectByRole(auth.getUser().role);
      }
    });
  </script>
</body>
</html>
